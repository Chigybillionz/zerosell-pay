name: Deploy ZeroSell Contract to Devnet

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Solana Cluster"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - testnet
      rpc_url:
        description: "Custom RPC URL (optional, defaults to public cluster RPC)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Solana CLI
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: ~/.local/share/solana/
          key: ${{ runner.os }}-solana-v1.18.26

      - name: Install Solana CLI (Anza v1.18.26)
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI (Pre-built v0.30.1)
        run: npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Verify Solana, Anchor & Node Versions
        run: |
          solana --version
          anchor --version
          node --version

      - name: Setup Deployer Keypair & RPC
        run: |
          mkdir -p ~/.config/solana
          if [ -n "${{ secrets.DEPLOYER_KEYPAIR }}" ]; then
            echo "${{ secrets.DEPLOYER_KEYPAIR }}" > ~/.config/solana/id.json
            echo "✅ Loaded deployer keypair from GitHub Secrets."
          else
            solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force
            echo "⚠️ Generated fresh deployer keypair."
          fi
          
          RPC_ENDPOINT="${{ inputs.rpc_url }}"
          if [ -z "$RPC_ENDPOINT" ]; then
            RPC_ENDPOINT="https://api.${{ inputs.cluster }}.solana.com"
          fi
          echo "RPC_URL=$RPC_ENDPOINT" >> $GITHUB_ENV
          
          solana config set --url "$RPC_ENDPOINT"
          solana config set --keypair ~/.config/solana/id.json
          echo "Deployer Address: $(solana address)"

      - name: Fund Deployer Wallet via Devnet Faucet
        run: |
          DEPLOYER=$(solana address)
          echo "Deployer Address: $DEPLOYER"
          
          # Check current balance
          BAL=$(solana balance | awk '{print $1}')
          echo "Current balance: $BAL SOL"
          
          # Attempt airdrops if balance is below 2.2 SOL
          for i in 1 2 3 4 5; do
            CURRENT=$(solana balance | awk '{print $1}')
            HAS_ENOUGH=$(awk -v b="$CURRENT" 'BEGIN {print (b >= 2.2) ? 1 : 0}')
            if [ "$HAS_ENOUGH" -eq 1 ]; then
              echo "✅ Sufficient balance: $CURRENT SOL"
              break
            fi
            echo "Attempt $i: Requesting devnet SOL airdrop for $DEPLOYER..."
            solana airdrop 2 $DEPLOYER --url https://api.devnet.solana.com || \
            solana airdrop 1 $DEPLOYER --url https://api.devnet.solana.com || \
            solana airdrop 2 $DEPLOYER || true
            sleep 6
          done
          
          FINAL_BAL=$(solana balance | awk '{print $1}')
          echo "Final Deployer Balance: $FINAL_BAL SOL"
          
          HAS_ENOUGH=$(awk -v b="$FINAL_BAL" 'BEGIN {print (b >= 2.0) ? 1 : 0}')
          if [ "$HAS_ENOUGH" -eq 0 ]; then
            echo "::error::Deployer $DEPLOYER has only $FINAL_BAL SOL. Deployment requires ~2.0 SOL for account rent."
            echo "👉 Recommended Solution: Add GitHub Secret 'DEPLOYER_KEYPAIR' with a pre-funded devnet wallet, or request devnet SOL at https://faucet.solana.com/?address=$DEPLOYER"
            exit 1
          fi

      - name: Prepare Program Keypair & Sync Keys
        run: |
          mkdir -p target/deploy
          PROGRAM_KEYPAIR="target/deploy/zerosell_vault-keypair.json"
          if [ -n "${{ secrets.PROGRAM_KEYPAIR }}" ]; then
            echo "${{ secrets.PROGRAM_KEYPAIR }}" > "$PROGRAM_KEYPAIR"
            echo "✅ Loaded program keypair from GitHub Secrets."
          elif [ ! -f "$PROGRAM_KEYPAIR" ]; then
            solana-keygen new --no-bip39-passphrase -o "$PROGRAM_KEYPAIR" --force
            echo "⚠️ Generated fresh program keypair."
          fi
          PROGRAM_ID=$(solana address -k "$PROGRAM_KEYPAIR")
          echo "Target Program ID: $PROGRAM_ID"
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          
          # Sync program ID in lib.rs and Anchor.toml
          anchor keys sync

      - name: Build Anchor Smart Contract
        run: |
          sed -i 's/version = 4/version = 3/' Cargo.lock || true
          anchor build --no-idl
          ls -la target/deploy/

      - name: Sync Generated IDL
        run: |
          mkdir -p target/idl
          if [ -f "backend/src/idl/zerosell_vault.json" ]; then
            cp backend/src/idl/zerosell_vault.json target/idl/zerosell_vault.json
            cp backend/src/idl/zerosell_vault.json frontend/src/idl/zerosell_vault.json
            echo "✅ IDL synchronized across target, backend, and frontend."
          fi

      - name: Deploy zerosell_vault Program
        id: deploy
        run: |
          PROGRAM_KEYPAIR="target/deploy/zerosell_vault-keypair.json"
          solana program deploy \
            --program-id "$PROGRAM_KEYPAIR" \
            target/deploy/zerosell_vault.so

      - name: Install Node Dependencies
        run: npm install

      - name: Initialize Protocol On-Chain (ProtocolConfig & LiquidityVault)
        env:
          PROGRAM_ID: ${{ env.PROGRAM_ID }}
          SOLANA_RPC_URL: ${{ env.RPC_URL }}
          ANCHOR_WALLET: "/home/runner/.config/solana/id.json"
        run: npm run init:protocol

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 ZeroSell Smart Contract Deployed to Solana ${{ inputs.cluster }}!" >> $GITHUB_STEP_SUMMARY
          echo "- **Program ID:** \`${{ env.PROGRAM_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployer Wallet:** \`$(solana address)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Explorer Link:** [View on Solscan](https://solscan.io/account/${{ env.PROGRAM_ID }}?cluster=${{ inputs.cluster }})" >> $GITHUB_STEP_SUMMARY
